<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ansichten-Trainer</title>
<script src="../../lib/three.min.js"></script>
<script src="./profile.js"></script>
<script src="./lib/bauteil-explorer.js"></script>
<script src="./trainer.js"></script>
<style>
  :root {
    --bg: #f2efe6;
    --surface: #fffdf8;
    --panel-surface: #ffffff;
    --ink: #202537;
    --line: #262d43;
    --muted: #6c7488;
    --accent: #bf5a2e;
    --card-border: rgba(32, 38, 58, 0.12);
    --panel-border: rgba(32, 38, 58, 0.18);
    --hover: rgba(32, 38, 58, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f;
      --surface: #1a1e28;
      --panel-surface: #1e2330;
      --ink: #e9ebf2;
      --line: #d4d9e6;
      --muted: #8d94a8;
      --accent: #e08a54;
      --card-border: rgba(233, 235, 242, 0.12);
      --panel-border: rgba(233, 235, 242, 0.16);
      --hover: rgba(233, 235, 242, 0.07);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f;
    --surface: #1a1e28;
    --panel-surface: #1e2330;
    --ink: #e9ebf2;
    --line: #d4d9e6;
    --muted: #8d94a8;
    --accent: #e08a54;
    --card-border: rgba(233, 235, 242, 0.12);
    --panel-border: rgba(233, 235, 242, 0.16);
    --hover: rgba(233, 235, 242, 0.07);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
    padding: clamp(12px, 3vw, 40px);
  }
  .page { max-width: 1180px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  h1 {
    font-weight: 800;
    font-size: clamp(22px, 3.4vw, 34px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .subtitle { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 0; max-width: 70ch; }

  .layout { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start; }
  body.einzelteil .layout { grid-template-columns: 1fr; }
  body.einzelteil nav.teile { display: none; }

  nav.teile {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    align-content: start;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 8px;
    max-height: 640px;
    overflow-y: auto;
  }
  nav.teile button {
    all: unset;
    cursor: pointer;
    position: relative;
    display: block;
    box-sizing: border-box;
    aspect-ratio: 240 / 170;
    background-color: var(--panel-surface);
    border: 1.5px solid var(--card-border);
    border-radius: 6px;
    padding: 4px;
  }
  nav.teile button img { width: 100%; height: 100%; object-fit: contain; display: block; }
  nav.teile button .nr {
    position: absolute; left: 6px; top: 4px;
    font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; color: var(--muted);
  }
  nav.teile button:hover { background-color: var(--hover); }
  nav.teile button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav.teile button.active { border-color: var(--accent); border-width: 2px; }

  .viewer-col { min-width: 0; }
  /* Die Zeichenfläche bleibt auch im Dunkelmodus hell – wie ein Zeichenblatt. */
  .viewer-wrap {
    --panel-surface: #ffffff;
    --ink: #202537;
    --muted: #6c7488;
    --accent: #bf5a2e;
    --card-border: rgba(32, 38, 58, 0.09);
    --panel-border: rgba(32, 38, 58, 0.18);
    --hover: rgba(32, 38, 58, 0.06);
    color: var(--ink);
    position: relative;
    background: var(--panel-surface);
    background-image:
      linear-gradient(var(--card-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    height: 600px;
    touch-action: none;
    cursor: grab;
  }
  .viewer-wrap.dragging { cursor: grabbing; }
  .viewer-wrap canvas { display: block; width: 100%; height: 100%; }

  .chip {
    position: absolute;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel-surface);
    padding: 5px 9px;
    border-radius: 5px;
    pointer-events: none;
    opacity: 0.92;
  }
  .hint { left: 14px; bottom: 12px; }
  .masse { right: 14px; bottom: 12px; text-transform: none; color: var(--ink); pointer-events: auto; }
  .ansicht-label {
    left: 50%; top: 12px; transform: translateX(-50%);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700;
    text-transform: none; letter-spacing: 0; color: var(--accent);
  }

  .name-label, .name-btn {
    position: absolute; left: 14px; top: 12px;
    font-weight: 700; font-size: 14px;
    background: var(--panel-surface);
    padding: 5px 10px; border-radius: 5px; opacity: 0.94;
    max-width: calc(50% - 90px);
  }
  .name-btn { all: unset; position: absolute; left: 14px; top: 12px; cursor: pointer; font-weight: 700; font-size: 13.5px;
    color: var(--ink); background: var(--panel-surface); border: 1px dashed var(--panel-border); padding: 5px 10px; border-radius: 5px; }
  .name-btn:hover { background: var(--hover); }

  .top-btn {
    all: unset;
    position: absolute; right: 14px; top: 12px;
    cursor: pointer;
    font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink); background: var(--panel-surface);
    border: 1px solid var(--panel-border); padding: 6px 10px; border-radius: 5px; opacity: 0.94;
  }
  .top-btn:hover { background: var(--hover); }
  .top-btn.zeichnung { top: 46px; }

  .meldung {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; font-size: 15px; color: var(--muted); pointer-events: none;
  }
  .hidden { display: none !important; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 12px; }
  .toolbar .gruppe { display: flex; flex-wrap: wrap; gap: 6px; }
  .toolbar button {
    all: unset; cursor: pointer;
    font-size: 13.5px; font-weight: 600;
    color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--card-border); border-radius: 7px;
    padding: 8px 12px;
  }
  .toolbar button:hover { background: var(--hover); }
  .toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toolbar button.active { border-color: var(--accent); color: var(--accent); }
  .toolbar button[aria-pressed]::before {
    content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px;
    border-radius: 2px; border: 1.5px solid currentColor; vertical-align: 0;
  }
  .toolbar button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(10, 12, 18, 0.72);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay .blatt {
    position: relative; background: #fff; border-radius: 10px; padding: 12px;
    max-width: min(1100px, 100%); max-height: 100%; display: flex;
  }
  .overlay img { max-width: 100%; max-height: calc(100vh - 56px); object-fit: contain; display: block; }
  .overlay .zu { right: 8px; top: 8px; background: #fff; color: #202537; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 10px; }
    nav.teile {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 96px;
      overflow-x: auto; overflow-y: hidden; max-height: none;
    }
    .viewer-wrap { height: 62vh; min-height: 320px; }
    .hint { display: none; }
    .name-label, .name-btn { max-width: calc(100% - 150px); }
    .ansicht-label { top: auto; bottom: 12px; left: 14px; transform: none; }
    .toolbar button { padding: 8px 10px; font-size: 13px; }
  }
  /* Ansichtsfarben: gleiche Farbe auf Knopf, Beschriftung und eingefärbten Flächen */
  .toolbar button[data-ansicht="vorne"] { --vf: #6fa8dc; }
  .toolbar button[data-ansicht="oben"]  { --vf: #7cc48a; }
  .toolbar button[data-ansicht="links"] { --vf: #f0a35e; }
  .toolbar button[data-ansicht="vorne"]::after, .toolbar button[data-ansicht="oben"]::after, .toolbar button[data-ansicht="links"]::after {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-left: 7px; vertical-align: -1px; background: var(--vf);
  }
  .toolbar button[data-ansicht="vorne"].active, .toolbar button[data-ansicht="oben"].active, .toolbar button[data-ansicht="links"].active {
    border-color: var(--vf); box-shadow: inset 0 -3px 0 var(--vf);
  }

  /* ---- Ansichten-Trainer ---- */
  .page { max-width: 1240px; }
  .modi { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .modi button {
    all: unset; cursor: pointer; font-size: 14px; font-weight: 700; padding: 9px 14px;
    border-radius: 8px; border: 1.5px solid var(--card-border); background: var(--surface); color: var(--ink);
  }
  .modi button:hover { background: var(--hover); }
  .modi button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modi button.active { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .modi .st { color: var(--accent); margin-right: 4px; letter-spacing: -1px; }

  .trainer { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .aufgabe {
    background: var(--surface); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px 16px;
  }
  .aufgabe h2 { font-size: 18px; margin: 4px 0 8px; }
  .aufgabe .sterne { color: var(--accent); margin-right: 4px; letter-spacing: -1px; }
  .auftrag { margin: 0 0 12px; line-height: 1.45; font-size: 15px; }
  .hinweis { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin: 10px 0 0; }
  .rolle { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px dashed var(--card-border); }
  .rolle b { color: var(--ink); }
  .rolle .zaehler { margin-left: auto; font-variant-numeric: tabular-nums; }

  .wahl { margin: 0 0 12px; }
  .wahl-titel { font-size: 13.5px; margin-bottom: 6px; color: var(--muted); }
  .wahl-titel b { color: var(--ink); }
  .profile { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
  .profil {
    all: unset; cursor: pointer; aspect-ratio: 1 / 1.25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 1.5px solid var(--card-border); border-radius: 6px; background: #fff; color: #202537; padding: 3px;
  }
  .profil svg { width: 100%; height: auto; }
  .profil span { font-size: 11px; font-family: Consolas, monospace; color: #6c7488; }
  .profil.active { border-color: var(--accent); border-width: 2px; box-shadow: inset 0 -3px 0 var(--accent); }
  .profil:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .gegeben { display: grid; grid-template-columns: minmax(0, 170px); gap: 10px; margin-bottom: 12px; }
  .gegeben.zwei { grid-template-columns: repeat(2, minmax(0, 170px)); }
  .ansicht-karte { margin: 0; background: #fff; border: 1.5px solid #20253733; border-radius: 8px; padding: 6px; }
  .ansicht-karte img { width: 100%; display: block; }
  .ansicht-karte figcaption { font-size: 12.5px; color: #3b4256; text-align: center; padding-top: 2px; font-weight: 600; }

  .optionen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .option {
    all: unset; cursor: pointer; position: relative; box-sizing: border-box;
    background: #fff; color: #202537; border: 2px solid #2025372a; border-radius: 8px; padding: 6px;
  }
  .option img { width: 100%; display: block; }
  .option > span { position: absolute; left: 8px; top: 5px; font-weight: 800; font-size: 14px; color: #6c7488; }
  .option:hover { border-color: #20253766; }
  .option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option.richtig { border-color: #2b7a46; box-shadow: 0 0 0 3px #2b7a4633; }
  .option.richtig > span { color: #2b7a46; }
  .option.falsch { border-color: #b3323f; opacity: .55; }
  .option:disabled { cursor: default; }
  .optionen.text .option { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .optionen.text .option b { font-size: 15px; }
  .optionen.text .option small { color: #6c7488; font-size: 12.5px; }

  .rueckmeldung { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45; border: 1.5px solid; }
  .rueckmeldung.ok { border-color: #2b7a46; background: #2b7a4612; }
  .rueckmeldung.nein { border-color: #b3323f; background: #b3323f10; }
  .wechsel { margin: 8px 0 0; font-weight: 700; color: var(--accent); }
  .zeile { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .knopf {
    all: unset; cursor: pointer; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 7px;
    border: 1.5px solid var(--card-border); background: var(--panel-surface); color: var(--ink);
  }
  .knopf:hover { background: var(--hover); }
  .knopf:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .knopf.primaer { background: var(--accent); border-color: var(--accent); color: #fff; }
  .satz { margin-top: 12px; font-size: 13.5px; }
  .satz summary { cursor: pointer; color: var(--muted); font-weight: 600; }
  .satz ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.6; }

  /* In Aufgaben: Normansicht-Knöpfe erst nach der Lösung, Name ausblenden */
  body.gesperrt .toolbar button[data-ansicht="vorne"],
  body.gesperrt .toolbar button[data-ansicht="oben"],
  body.gesperrt .toolbar button[data-ansicht="links"] { display: none; }
  body:not([data-modus="entdecken"]) #nameLabel, #nameBtn, #tglMittel, #zeichnungBtn { display: none !important; }
  body.viewer-aus .viewer-col { display: none; }
  .viewer-wrap { height: 560px; }
  @media (max-width: 860px) { .masse { display: none; } }
  .quelle { margin-top: 18px; font-size: 12px; color: var(--muted); }

  @media (max-width: 860px) {
    .trainer { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .viewer-col { order: -1; }
    .viewer-wrap { height: 46vh; min-height: 280px; }
    .gegeben, .gegeben.zwei { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modi button { padding: 8px 10px; font-size: 13px; }
  }
</style>
</head>
<body data-modus="entdecken">
<div class="page">
  <header>
    <h1 id="titel">Ansichten-Trainer</h1>
    <p class="subtitle" id="untertitel">Welche Ansicht gehört zu welchem Körper – und aus welcher Richtung sieht man sie? Drehe den Körper mit Maus oder Finger.</p>
  </header>
  <nav class="modi" aria-label="Aufgabenart">
    <button data-modus="entdecken">Entdecken</button>
    <button data-modus="ansicht"><span class="st">★</span>Ansicht finden</button>
    <button data-modus="blick"><span class="st">★★</span>Blickrichtung</button>
    <button data-modus="koerper"><span class="st">★★★</span>Körper finden</button>
  </nav>
  <div class="trainer">
    <section class="aufgabe" id="aufgabe" aria-live="polite"></section>
    <div class="viewer-col">
      <nav class="teile" id="teilListe" aria-label="Bauteile" hidden></nav>
      <div class="viewer-wrap" id="viewerWrap">
        <button class="name-btn hidden" id="nameBtn">Name ?</button>
        <div class="name-label" id="nameLabel"></div>
        <div class="chip ansicht-label" id="ansichtLabel"></div>
        <button class="top-btn" id="resetBtn">Zurücksetzen</button>
        <button class="top-btn zeichnung hidden" id="zeichnungBtn">Zeichnung</button>
        <div class="meldung hidden" id="meldung"></div>
        <div class="chip hint">Ziehen zum Drehen · Scrollen zum Zoomen</div>
        <div class="chip masse" id="masse"></div>
      </div>
      <div class="toolbar">
        <div class="gruppe" role="group" aria-label="Ansicht wählen">
          <button data-ansicht="iso">3D (isometrisch)</button>
          <button data-ansicht="vorne">Vorderansicht</button>
          <button data-ansicht="oben">Draufsicht</button>
          <button data-ansicht="links">Seitenansicht v. links</button>
        </div>
        <div class="gruppe" role="group" aria-label="Darstellung">
          <button id="tglVerdeckt" aria-pressed="true">Verdeckte Kanten</button>
          <button id="tglMittel" aria-pressed="false">Mittellinien</button>
          <button id="tglDrehen" aria-pressed="false">Drehen</button>
        </div>
      </div>
    </div>
  </div>
  <p class="quelle">Profil-Idee: „Freihandskizzen üben mit multiplen Prismen“ nach Ulrich Rapp (ulrich-rapp.de).</p>
</div>
<div class="overlay hidden" id="zeichnungOverlay">
  <div class="blatt"><img id="zeichnungImg" alt=""><button class="top-btn zu" id="zeichnungZu">Schließen</button></div>
</div>
</body>
</html>
