<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raumecke-Explorer</title>
<style>
  /* Layout wie der Bauteil-Explorer: Kopf, links Bauteil-Leiste mit Vorschaubildern, rechts helles Zeichenblatt mit 3D-Szene, darunter Werkzeugleiste */
  :root {
    --bg: #f2efe6;
    --surface: #fffdf8;
    --panel-surface: #ffffff;
    --ink: #202537;
    --muted: #6c7488;
    --accent: #bf5a2e;
    --card-border: rgba(32, 38, 58, 0.12);
    --panel-border: rgba(32, 38, 58, 0.18);
    --hover: rgba(32, 38, 58, 0.06);
    --v: #6fa8dc;
    --d: #7cc48a;
    --s: #f0a35e;
    --font: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
    --mono: 'Consolas', 'Courier New', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --surface: #1a1e28; --panel-surface: #1e2330; --ink: #e9ebf2; --muted: #8d94a8; --accent: #e08a54;
      --card-border: rgba(233, 235, 242, 0.12); --panel-border: rgba(233, 235, 242, 0.16); --hover: rgba(233, 235, 242, 0.07);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --surface: #1a1e28; --panel-surface: #1e2330; --ink: #e9ebf2; --muted: #8d94a8; --accent: #e08a54;
    --card-border: rgba(233, 235, 242, 0.12); --panel-border: rgba(233, 235, 242, 0.16); --hover: rgba(233, 235, 242, 0.07);
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    padding-block: clamp(12px, 3vw, 40px);
    padding-left: max(clamp(16px, 3vw, 40px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 3vw, 40px), env(safe-area-inset-right, 0px));
  }
  .page { max-width: 1180px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  h1 { font-weight: 800; font-size: clamp(22px, 3.4vw, 34px); letter-spacing: -0.01em; margin: 0 0 6px; text-wrap: balance; }
  .subtitle { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 0; max-width: 70ch; }

  .layout { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start; }
  nav.teile {
    display: grid; grid-template-columns: 1fr; gap: 6px; align-content: start;
    background: var(--surface); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px;
  }
  nav.teile button {
    all: unset; cursor: pointer; position: relative; display: block; box-sizing: border-box;
    aspect-ratio: 240 / 170; background-color: #ffffff;
    border: 1.5px solid var(--card-border); border-radius: 6px; padding: 4px;
  }
  nav.teile button img { width: 100%; height: 100%; object-fit: contain; display: block; }
  nav.teile button .nr {
    position: absolute; left: 6px; top: 4px; font-family: var(--mono); font-size: 11px; color: #6c7488;
  }
  nav.teile button:hover { background-color: #f6f5f1; }
  nav.teile button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav.teile button.active { border-color: var(--accent); border-width: 2px; }

  .viewer-col { min-width: 0; }
  /* Die Zeichenfläche bleibt auch im Dunkelmodus hell – wie ein Zeichenblatt. */
  .viewer-wrap {
    --panel-surface: #ffffff; --ink: #202537; --muted: #6c7488; --accent: #bf5a2e;
    --card-border: rgba(32, 38, 58, 0.09); --panel-border: rgba(32, 38, 58, 0.18); --hover: rgba(32, 38, 58, 0.06);
    color: var(--ink); position: relative; background: var(--panel-surface);
    background-image: linear-gradient(var(--card-border) 1px, transparent 1px), linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden;
    height: 600px; touch-action: none; cursor: grab;
  }
  .viewer-wrap.dragging { cursor: grabbing; }
  .viewer-wrap canvas { display: block; width: 100%; height: 100%; }
  .chip {
    position: absolute; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--muted); background: var(--panel-surface); padding: 5px 9px; border-radius: 5px; pointer-events: none; opacity: 0.92;
  }
  .hint-chip { left: 14px; bottom: 12px; }
  .ansicht-label {
    left: 50%; top: 12px; transform: translateX(-50%);
    font-family: var(--font); font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--accent);
  }
  .name-label {
    position: absolute; left: 14px; top: 12px; font-weight: 700; font-size: 14px;
    background: var(--panel-surface); padding: 5px 10px; border-radius: 5px; opacity: 0.94; max-width: calc(50% - 90px);
  }
  .top-btn {
    all: unset; position: absolute; right: 14px; top: 12px; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink); background: var(--panel-surface); border: 1px solid var(--panel-border); padding: 6px 10px; border-radius: 5px; opacity: 0.94;
  }
  .top-btn:hover { background: var(--hover); }
  .top-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .meldung { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 15px; color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 12px; align-items: center; }
  .toolbar .gruppe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .toolbar .gruppe[hidden] { display: none; }
  .toolbar button {
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--ink); background: var(--surface); border: 1.5px solid var(--card-border); border-radius: 7px; padding: 8px 12px;
  }
  .toolbar button:hover { background: var(--hover); }
  .toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toolbar button.active { border-color: var(--accent); color: var(--accent); }
  .toolbar button:disabled { opacity: .45; cursor: not-allowed; }
  .toolbar button[aria-pressed]::before {
    content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 2px; border: 1.5px solid currentColor; vertical-align: 0;
  }
  .toolbar button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
  .toolbar .schritte button .nrx { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
  .toolbar .schritte button.active .nrx { color: var(--accent); }
  .toolbar button[data-ansicht="vorne"] { --vf: var(--v); }
  .toolbar button[data-ansicht="oben"]  { --vf: var(--d); }
  .toolbar button[data-ansicht="links"] { --vf: var(--s); }
  .toolbar button[data-ansicht]:not([data-ansicht="iso"])::after {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-left: 7px; vertical-align: -1px; background: var(--vf);
  }
  .toolbar button[data-ansicht].active:not([data-ansicht="iso"]) { border-color: var(--vf); color: var(--ink); box-shadow: inset 0 -3px 0 var(--vf); }
  .regler { display: flex; align-items: center; gap: 10px; flex: 1 1 240px; min-width: 0; }
  .regler input { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .regler output { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; width: 4em; text-align: right; color: var(--muted); }
  .auftrag { margin: 12px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; max-width: 70ch; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 10px; }
    nav.teile { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 96px; overflow-x: auto; overflow-y: hidden; }
    .viewer-wrap { height: 62vh; min-height: 320px; }
    .hint-chip { display: none; }
    .name-label { max-width: calc(100% - 150px); }
    .ansicht-label { top: auto; bottom: 12px; left: 14px; transform: none; }
    .toolbar button { padding: 8px 10px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="page">
  <header>
    <h1>Raumecke-Explorer</h1>
    <p class="subtitle">Dreitafelprojektion entdecken: Das Bauteil steht in einer Ecke aus drei Wänden. Jede Wand fängt eine Ansicht auf. Klappe die Wände auf und finde heraus, wo welche Ansicht landet.</p>
  </header>

  <div class="layout">
    <nav class="teile" id="teilListe" aria-label="Bauteile"></nav>
    <div class="viewer-col">
      <div class="viewer-wrap" id="viewerWrap">
        <div class="name-label" id="nameLabel"></div>
        <div class="chip ansicht-label" id="ansichtLabel">3D-Ansicht</div>
        <button class="top-btn" id="resetBtn">Zurücksetzen</button>
        <div class="chip hint-chip">Ziehen zum Drehen · Scrollen zum Zoomen</div>
      </div>

      <div class="toolbar">
        <div class="gruppe schritte" role="group" aria-label="Schritt wählen">
          <button data-step="1" class="active"><span class="nrx">1</span>Bauteil</button>
          <button data-step="2"><span class="nrx">2</span>Raumecke</button>
          <button data-step="3"><span class="nrx">3</span>Aufklappen</button>
        </div>
        <div class="gruppe" id="grpAnsicht" role="group" aria-label="Ansicht wählen">
          <button data-ansicht="iso" class="active">3D</button>
          <button data-ansicht="vorne">Vorderansicht</button>
          <button data-ansicht="oben">Draufsicht</button>
          <button data-ansicht="links">Seitenansicht v. links</button>
          <button id="tglMasse" aria-pressed="true">Länge · Höhe · Tiefe</button>
        </div>
        <div class="gruppe" id="grpEcke" role="group" aria-label="Darstellung" hidden>
          <button id="tglStrahlen" aria-pressed="true">Projektionslinien</button>
          <button id="tglPfeile" aria-pressed="true">Blickrichtungen</button>
        </div>
        <div class="gruppe regler" id="grpTransp" hidden>
          <label for="transp" style="font-size:13.5px;font-weight:600">Bauteil durchsichtig</label>
          <input type="range" id="transp" min="0" max="100" value="0" aria-label="Bauteil durchsichtig machen">
          <output id="transpOut">0 %</output>
        </div>
        <div class="gruppe regler" id="grpKlappen" hidden>
          <button id="play">Aufklappen</button>
          <input type="range" id="fold" min="0" max="100" value="0" aria-label="Wände aufklappen">
          <output id="foldOut">0 %</output>
        </div>
        <div class="gruppe" id="grpBlatt" role="group" aria-label="Darstellung" hidden>
          <button id="tglBauteil" aria-pressed="true">Bauteil</button>
          <button id="tglOrdnung" aria-pressed="false" disabled>Ordnungslinien</button>
          <button id="sheet">Blick auf die Zeichnung</button>
        </div>
      </div>
      <p class="auftrag" id="auftrag"></p>
    </div>
  </div>
</div>

<script src="../../lib/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const wrap = $('viewerWrap');
  if (!window.THREE) { wrap.insertAdjacentHTML('beforeend', '<div class="meldung">Die 3D-Ansicht konnte nicht geladen werden. Bitte die Seite neu laden.</div>'); return; }

  // ---------- Bauteile (mm, Raster 5 mm) ----------
  // achse z: Profil in der Vorderansicht (x, y) | achse y: Profil in der Draufsicht (x, z) | achse x: Profil in der Seitenansicht (z, y)
  const PARTS = {
    a: { name: 'Stufenklotz', axis: 'z', depth: 30, pts: [[0,0],[60,0],[60,40],[30,40],[30,20],[0,20]] },
    b: { name: 'Eckklotz',    axis: 'y', depth: 20, pts: [[0,0],[60,0],[60,40],[25,40],[25,20],[0,20]] },
    c: { name: 'Keil',        axis: 'x', depth: 60, pts: [[0,0],[40,0],[40,10],[15,30],[0,30]] },
    d: { name: 'U-Profil',    axis: 'x', depth: 60, pts: [[0,0],[40,0],[40,30],[30,30],[30,10],[10,10],[10,30],[0,30]] }
  };
  const G = 1.5, S = 0.1;   // Wandabstand 15 mm, mm -> Szeneneinheit

  // Farben wie im Bauteil-Explorer (Zeichenblatt bleibt immer hell)
  const C = {
    ink: '#262d43', neutral: '#d9d2c0', grid: '#e4e1d8', accent: '#b4532a',
    v: '#6fa8dc', d: '#7cc48a', s: '#f0a35e',
    vT: '#2f6aa3', dT: '#3d8a4e', sT: '#b9671f'   // dunklere Töne für Schrift auf den Wänden
  };

  // ---------- Grundgerüst ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  wrap.insertBefore(renderer.domElement, wrap.firstChild);
  const lichter = sc => {
    sc.add(new THREE.AmbientLight(0xffffff, 0.55));
    const k = new THREE.DirectionalLight(0xffffff, 0.9); k.position.set(4, 6, 5); sc.add(k);
    const f = new THREE.DirectionalLight(0xffffff, 0.35); f.position.set(-5, -2, -4); sc.add(f);
    const l = new THREE.DirectionalLight(0xffffff, 0.35); l.position.set(-6, 1, 1); sc.add(l);
  };
  const scene = new THREE.Scene(); lichter(scene);
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 500);

  // ---------- Kamera ----------
  const ISO = { theta: Math.PI / 4, phi: Math.acos(1 / Math.sqrt(3)) };
  const cam = { target: new THREE.Vector3(), r: 20, theta: ISO.theta, phi: ISO.phi };
  let tween = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function placeCamera(c, st, aspect) {
    const sp = Math.sin(st.phi);
    c.position.set(st.target.x + st.r * sp * Math.sin(st.theta), st.target.y + st.r * Math.cos(st.phi), st.target.z + st.r * sp * Math.cos(st.theta));
    c.up.set(-Math.cos(st.phi) * Math.sin(st.theta), sp, -Math.cos(st.phi) * Math.cos(st.theta));
    c.lookAt(st.target);
  }
  function flyTo(to, ms = 650) {
    const from = { t: cam.target.clone(), r: cam.r, theta: cam.theta, phi: cam.phi };
    let dT = to.theta - from.theta; dT = Math.atan2(Math.sin(dT), Math.cos(dT));
    const t0 = performance.now();
    tween = now => {
      const k = reduce ? 1 : Math.min(1, (now - t0) / ms);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cam.target.lerpVectors(from.t, to.target, e);
      cam.r = from.r + (to.r - from.r) * e; cam.theta = from.theta + dT * e; cam.phi = from.phi + (to.phi - from.phi) * e;
      if (k >= 1) tween = null;
    };
  }
  const clampR = r => Math.min(140, Math.max(4, r));
  const pointers = new Map(); let pinch0 = 0, r0 = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); tween = null; wrap.classList.add('dragging');
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = cam.r; } });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = pointers.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) { cam.theta -= dx * 0.008; cam.phi = Math.min(Math.PI - 0.001, Math.max(0.001, cam.phi - dy * 0.008)); markView(null); }
    else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) cam.r = clampR(r0 * pinch0 / d); }
  });
  const up = e => { pointers.delete(e.pointerId); pinch0 = 0; if (!pointers.size) wrap.classList.remove('dragging'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); tween = null; cam.r = clampR(cam.r * Math.exp(e.deltaY * 0.001)); }, { passive: false });

  // ---------- Hilfsfunktionen ----------
  function shapeGeo(P) {
    const sh = new THREE.Shape();
    const map = P.axis === 'z' ? ([u, v]) => [u, v] : P.axis === 'y' ? ([x, z]) => [x, -z] : ([z, y]) => [-z, y];
    P.pts.map(map).forEach(([u, v], i) => i ? sh.lineTo(u, v) : sh.moveTo(u, v));
    let g = new THREE.ExtrudeGeometry(sh, { depth: P.depth, bevelEnabled: false });
    if (P.axis === 'y') g.rotateX(-Math.PI / 2);
    if (P.axis === 'x') g.rotateY(Math.PI / 2);
    g.computeBoundingBox(); const m = g.boundingBox.min; g.translate(-m.x, -m.y, -m.z);
    g.scale(S, S, S); g.computeBoundingBox(); g.computeVertexNormals();
    // Flächen nach Ansicht einfärben (wie im Bauteil-Explorer): vorne blau, oben grün, links orange
    const pos = g.attributes.position.array, col = new Float32Array(pos.length);
    const dirs = [[[0, 0, 1], C.v], [[0, 1, 0], C.d], [[-1, 0, 0], C.s]].map(([d, c]) => [d, new THREE.Color(c)]);
    const neutral = new THREE.Color(C.neutral), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pos.length; i += 9) {
      a.fromArray(pos, i); b.fromArray(pos, i + 3); c.fromArray(pos, i + 6);
      n.subVectors(b, a).cross(c.clone().sub(a)).normalize();
      let best = 0.3, pick = neutral;
      for (const [d, cc] of dirs) { const dot = n.x * d[0] + n.y * d[1] + n.z * d[2]; if (dot > best) { best = dot; pick = cc; } }
      for (let k = 0; k < 3; k++) { col[i + k * 3] = pick.r; col[i + k * 3 + 1] = pick.g; col[i + k * 3 + 2] = pick.b; }
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return g;
  }
  function ribbon(segs, n, w) {
    const pos = []; const N = new THREE.Vector3(...n);
    for (const [a, b] of segs) {
      const dir = b.clone().sub(a); const len = dir.length(); if (len < 1e-5) continue; dir.divideScalar(len);
      const a2 = a.clone().addScaledVector(dir, -w / 2), b2 = b.clone().addScaledVector(dir, w / 2);
      const side = new THREE.Vector3().crossVectors(N, dir).multiplyScalar(w / 2);
      const q = [a2.clone().add(side), a2.clone().sub(side), b2.clone().add(side), b2.clone().sub(side)];
      for (const i of [0, 1, 2, 2, 1, 3]) pos.push(q[i].x, q[i].y, q[i].z);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); return g;
  }
  function lines(pairs, color, opts = {}) {
    const pos = []; pairs.forEach(([a, b]) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z));
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const m = opts.dashed ? new THREE.LineDashedMaterial({ color, dashSize: .18, gapSize: .12, transparent: true, opacity: opts.opacity ?? 1 })
                          : new THREE.LineBasicMaterial({ color, transparent: true, opacity: opts.opacity ?? 1 });
    const l = new THREE.LineSegments(g, m); if (opts.dashed) l.computeLineDistances(); return l;
  }
  function label(text, color, h = 0.42) {
    const fs = 64, pad = 8, cnv = document.createElement('canvas'), ctx = cnv.getContext('2d');
    const font = `700 ${fs}px 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif`;
    ctx.font = font; cnv.width = Math.ceil(ctx.measureText(text).width) + pad * 2; cnv.height = fs + pad * 2;
    ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, pad, cnv.height / 2 + 2);
    const tex = new THREE.CanvasTexture(cnv); tex.anisotropy = 4;
    const w = h * cnv.width / cnv.height; const g = new THREE.PlaneGeometry(w, h); g.translate(w / 2, 0, 0);
    return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  }
  function wall(w0, w1, h0, h1, color) {
    const grp = new THREE.Group();
    const pg = new THREE.PlaneGeometry(w1 - w0, h1 - h0); pg.translate((w0 + w1) / 2, (h0 + h1) / 2, 0);
    grp.add(new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .16, side: THREE.DoubleSide, depthWrite: false })));
    const pairs = [], st = 0.5;
    for (let x = Math.ceil(w0 / st) * st; x <= w1 + 1e-6; x += st) pairs.push([new THREE.Vector3(x, h0, .002), new THREE.Vector3(x, h1, .002)]);
    for (let y = Math.ceil(h0 / st) * st; y <= h1 + 1e-6; y += st) pairs.push([new THREE.Vector3(w0, y, .002), new THREE.Vector3(w1, y, .002)]);
    grp.add(lines(pairs, color, { opacity: .35 }));
    const v = [[w0, h0], [w1, h0], [w1, h1], [w0, h1], [w0, h0]].map(([x, y]) => new THREE.Vector3(x, y, .004));
    const fr = []; for (let i = 0; i < 4; i++) fr.push([v[i], v[i + 1]]); grp.add(lines(fr, color));
    return grp;
  }
  function partObject(geo) {
    const grp = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: .85, metalness: .05, transparent: true, opacity: 1,
      polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    grp.add(new THREE.Mesh(geo, mat));
    const edges = new THREE.EdgesGeometry(geo, 15);
    grp.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: C.ink, transparent: true })));
    return { grp, mat, edges };
  }

  // ---------- Vorschaubilder für die Bauteil-Leiste ----------
  function vorschau(id) {
    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(2); r.setSize(240, 170);
    const sc = new THREE.Scene(); lichter(sc);
    const geo = shapeGeo(PARTS[id]); const { grp } = partObject(geo); sc.add(grp);
    const bb = geo.boundingBox.max; const ctr = new THREE.Vector3(bb.x / 2, bb.y / 2, bb.z / 2);
    const c = new THREE.PerspectiveCamera(24, 240 / 170, 0.1, 200);
    placeCamera(c, { target: ctr, r: bb.length() * 2.7, theta: ISO.theta, phi: ISO.phi });
    r.render(sc, c);
    const url = r.domElement.toDataURL('image/png');
    geo.dispose(); r.dispose(); if (r.forceContextLoss) r.forceContextLoss();
    return url;
  }

  // ---------- Aufbau eines Bauteils mit Raumecke ----------
  let world = null, st = {};
  const ray = new THREE.Raycaster();
  function build(id) {
    if (world) { scene.remove(world); world.traverse(o => { o.geometry && o.geometry.dispose(); if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }); }
    world = new THREE.Group(); scene.add(world);
    const geo = shapeGeo(PARTS[id]); const bb = geo.boundingBox.max; const L = bb.x, H = bb.y, T = bb.z;
    const { grp: part, mat, edges } = partObject(geo); world.add(part);

    // sichtbare Kanten je Ansicht (Strahltest Richtung Betrachter)
    const rayMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })); rayMesh.updateMatrixWorld();
    const ep = edges.attributes.position.array; const E = [];
    for (let i = 0; i < ep.length; i += 6) E.push([new THREE.Vector3(ep[i], ep[i + 1], ep[i + 2]), new THREE.Vector3(ep[i + 3], ep[i + 4], ep[i + 5])]);
    function visible(dir, proj) {
      const out = []; const D = new THREE.Vector3(...dir); const n = 40;
      for (const [a, b] of E) {
        if (proj(a).distanceTo(proj(b)) < 1e-4) continue;
        let runStart = null;
        for (let i = 0; i <= n; i++) {
          const t = 0.01 + 0.98 * i / n; const p = a.clone().lerp(b, t);
          ray.set(p.addScaledVector(D, 0.002), D);
          const vis = ray.intersectObject(rayMesh).length === 0;
          if (vis && runStart === null) runStart = i === 0 ? 0 : t - 0.49 / n;
          if (!vis && runStart !== null) { out.push([runStart, t - 0.49 / n, a, b]); runStart = null; }
        }
        if (runStart !== null) out.push([runStart, 1, a, b]);
      }
      return out.map(([t0, t1, a, b]) => [proj(a.clone().lerp(b, t0)), proj(a.clone().lerp(b, t1))]);
    }
    const W = 0.075, inkMat = () => new THREE.MeshBasicMaterial({ color: C.ink, side: THREE.DoubleSide });

    // Rückwand = Vorderansicht (Ebene z = -G)
    const back = new THREE.Group();
    back.add(wall(-G, L + G, -G, H + G, C.v).translateZ(-G));
    back.add(new THREE.Mesh(ribbon(visible([0, 0, 1], p => new THREE.Vector3(p.x, p.y, -G + 0.01)), [0, 0, 1], W), inkMat()));
    const lb = label('Vorderansicht', C.vT); lb.position.set(-G, H + G + 0.32, -G); back.add(lb);
    world.add(back);
    // Boden = Draufsicht, Gelenk an der Unterkante der Rückwand
    const floor = new THREE.Group(); floor.position.set(0, -G, -G);
    const fw = wall(-G, L + G, -(T + 2 * G), 0, C.d); fw.rotation.x = -Math.PI / 2; floor.add(fw);
    floor.add(new THREE.Mesh(ribbon(visible([0, 1, 0], p => new THREE.Vector3(p.x, 0.01, p.z + G)), [0, 1, 0], W), inkMat()));
    const ld = label('Draufsicht', C.dT); ld.rotation.x = -Math.PI / 2; ld.position.set(-G, 0.01, T + 2 * G + 0.32); floor.add(ld);
    world.add(floor);
    // rechte Seitenwand = Seitenansicht von links, Gelenk an der rechten Kante der Rückwand
    const side = new THREE.Group(); side.position.set(L + G, 0, -G);
    const sw = wall(0, T + 2 * G, -G, H + G, C.s); sw.rotation.y = -Math.PI / 2; side.add(sw);
    side.add(new THREE.Mesh(ribbon(visible([-1, 0, 0], p => new THREE.Vector3(-0.01, p.y, p.z + G)), [1, 0, 0], W), inkMat()));
    const ls = label('Seitenansicht von links', C.sT); ls.rotation.y = -Math.PI / 2; ls.position.set(-0.01, H + G + 0.32, 0); side.add(ls);
    world.add(side);

    // Eckpunkte und vorkommende Koordinaten
    const pa = geo.attributes.position.array; const seen = new Set(); const verts = [];
    const xs = new Set(), ys = new Set(), zs = new Set(); const r = v => Math.round(v * 1000) / 1000;
    for (let i = 0; i < pa.length; i += 3) { const k = [r(pa[i]), r(pa[i + 1]), r(pa[i + 2])]; xs.add(k[0]); ys.add(k[1]); zs.add(k[2]);
      const s = k.join(','); if (!seen.has(s)) { seen.add(s); verts.push(new THREE.Vector3(...k)); } }

    // Projektionslinien (nur bei geschlossener Ecke)
    const rays = new THREE.Group();
    rays.add(lines(verts.map(v => [v, new THREE.Vector3(v.x, v.y, -G)]), C.vT, { opacity: .5 }));
    rays.add(lines(verts.map(v => [v, new THREE.Vector3(v.x, -G, v.z)]), C.dT, { opacity: .5 }));
    rays.add(lines(verts.map(v => [v, new THREE.Vector3(L + G, v.y, v.z)]), C.sT, { opacity: .5 }));
    world.add(rays);

    // Blickrichtungen
    const arrows = new THREE.Group();
    const mk = (from, dir, color, txt, off) => {
      arrows.add(new THREE.ArrowHelper(new THREE.Vector3(...dir), new THREE.Vector3(...from), 1.8, new THREE.Color(color), .45, .3));
      const l = label(txt, color, .5); l.position.set(from[0] + off[0], from[1] + off[1], from[2] + off[2]); l.userData.billboard = true; arrows.add(l);
    };
    mk([L / 2, H / 2, T + 4.2], [0, 0, -1], C.vT, 'Blick von vorne', [-1.1, .5, 0]);
    mk([L / 2, H + 4.2, T / 2], [0, -1, 0], C.dT, 'Blick von oben', [.3, .4, 0]);
    mk([-4.2, H / 2, T / 2], [1, 0, 0], C.sT, 'Blick von links', [-1.6, .5, 0]);
    world.add(arrows);

    // Ordnungslinien und 45°-Spiegelachse auf der aufgeklappten Zeichenebene
    const z0 = -G + 0.02, ord = new THREE.Group(), P = (x, y) => new THREE.Vector3(x, y, z0);
    const xr = L + 2 * G + T, yb = -2 * G - T;
    ord.add(lines([...ys].map(y => [P(0, y), P(xr, y)]), C.accent, { dashed: true, opacity: .8 }));
    ord.add(lines([...xs].map(x => [P(x, H), P(x, yb)]), C.accent, { dashed: true, opacity: .8 }));
    ord.add(lines([...zs].flatMap(z => [[P(0, -2 * G - z), P(L + 2 * G + z, -2 * G - z)], [P(L + 2 * G + z, -2 * G - z), P(L + 2 * G + z, H)]]), C.accent, { dashed: true, opacity: .8 }));
    ord.add(lines([[P(L + G, -G), P(L + 2 * G + T + .6, -2 * G - T - .6)]], C.accent));
    const lsp = label('45°-Spiegelachse', C.accent, .34); lsp.position.set(L + 2 * G + T + .2, -2 * G - T - .9, z0); ord.add(lsp);
    // Mittelkreuz: die beiden Klapplinien zwischen den Ansichten
    ord.add(lines([[P(-G - .5, -G), P(xr + .6, -G)], [P(L + G, H + G + .5), P(L + G, yb - .6)]], C.ink, { dashed: true, opacity: .9 }));
    const lmk = label('Mittelkreuz', C.ink, .4); lmk.position.set(L + G + .15, -G + .25, z0); ord.add(lmk);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(.09, 24), new THREE.MeshBasicMaterial({ color: C.ink })); dot.position.set(L + G, -G, z0 + .005); ord.add(dot);
    world.add(ord);

    // Länge, Höhe, Tiefe am Bauteil (Maßpfeile mit Beschriftung)
    const masse = new THREE.Group(), mm = v => Math.round(v / S);
    const kegel = (pos, dir) => { const k = new THREE.Mesh(new THREE.ConeGeometry(.08, .28, 16), new THREE.MeshBasicMaterial({ color: C.accent }));
      k.position.copy(pos).addScaledVector(dir, -.14); k.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); masse.add(k); };
    const mass = (a, b, hilf, txt, off) => {
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A).normalize();
      masse.add(lines([[A, B], ...hilf.map(([p, q]) => [new THREE.Vector3(...p), new THREE.Vector3(...q)])], C.accent));
      kegel(B, d); kegel(A, d.clone().negate());
      const l = label(txt, C.accent, .46); l.position.copy(A.clone().add(B).multiplyScalar(.5)).add(new THREE.Vector3(...off)); l.userData.billboard = true; masse.add(l);
    };
    const o = .7;
    mass([0, 0, T + o], [L, 0, T + o], [[[0, 0, T], [0, 0, T + o + .25]], [[L, 0, T], [L, 0, T + o + .25]]], `Länge ${mm(L)} mm`, [-1.3, -.95, .5]);
    mass([-o, 0, T], [-o, H, T], [[[0, 0, T], [-o - .25, 0, T]], [[0, H, T], [-o - .25, H, T]]], `Höhe ${mm(H)} mm`, [-2.6, .1, 0]);
    mass([L + o, 0, 0], [L + o, 0, T], [[[L, 0, 0], [L + o + .25, 0, 0]], [[L, 0, T], [L + o + .25, 0, T]]], `Tiefe ${mm(T)} mm`, [.25, -.45, 0]);
    masse.traverse(o => { if (o.material) { o.material.depthTest = false; o.material.transparent = true; } o.renderOrder = 10; });
    world.add(masse);

    st = { L, H, T, part, mat, floor, side, back, rays, arrows, ord, masse, id };
    $('nameLabel').textContent = id.toUpperCase() + ' · ' + PARTS[id].name;
    applyState();
  }

  // ---------- Zustand ----------
  const AUFTRAG = {
    1: 'Schritt 1: Dreh das Bauteil. Tippe auf die drei Ansichten. Die farbigen Flächen zeigen dir, welche Seite du in welcher Ansicht siehst. Die Pfeile zeigen Länge (links – rechts), Höhe (unten – oben) und Tiefe (vorne – hinten).',
    2: 'Schritt 2: Das Bauteil schwebt in einer Ecke aus drei Wänden. Jede Wand fängt eine Ansicht auf. Die Projektionslinien zeigen, wie die Ecken des Bauteils auf die Wände fallen.',
    3: 'Schritt 3: Klappe den Boden und die Seitenwand auf. Beobachte: Wo landet die Draufsicht? Wo landet die Seitenansicht von links?'
  };
  const LABEL = { 1: '3D-Ansicht', 2: 'Raumecke', 3: 'Aufklappen' };
  let step = 1, fold = 0, transp = 0;
  const pressed = id => $(id).getAttribute('aria-pressed') === 'true';

  function applyState() {
    if (!st.part) return;
    const walls = step >= 2, f = step === 3 ? fold : 0;
    st.back.visible = st.floor.visible = st.side.visible = walls;
    st.floor.rotation.x = f * Math.PI / 2; st.side.rotation.y = f * Math.PI / 2;
    st.rays.visible = step === 2 && pressed('tglStrahlen');
    st.arrows.visible = step === 2 && pressed('tglPfeile');
    st.masse.visible = step === 1 && pressed('tglMasse');
    const full = step === 3 && fold > 0.995;
    $('tglOrdnung').disabled = !full;
    st.ord.visible = full && pressed('tglOrdnung');
    st.part.visible = step < 3 || pressed('tglBauteil');
    const op = step === 3 ? 1 - 0.8 * fold : step === 2 ? 1 - 0.95 * transp : 1;
    st.mat.opacity = op; st.mat.depthWrite = op > .99; st.part.children[1].material.opacity = Math.max(.25, op);
  }
  function setStep(n) {
    step = n;
    document.querySelectorAll('.schritte button').forEach(b => b.classList.toggle('active', +b.dataset.step === n));
    $('grpAnsicht').hidden = n !== 1; $('grpEcke').hidden = n !== 2; $('grpTransp').hidden = n !== 2; $('grpKlappen').hidden = n !== 3; $('grpBlatt').hidden = n !== 3;
    $('auftrag').textContent = AUFTRAG[n]; $('ansichtLabel').textContent = LABEL[n];
    applyState();
    if (n === 1) setView('iso'); else if (n === 2) viewCorner(); else (fold > 0.5 ? viewSheet : viewCorner)();
  }
  const center = () => new THREE.Vector3(st.L / 2, st.H / 2, st.T / 2);
  const fitR = (w, h) => { const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); return Math.max(h / 2 / t, w / 2 / t / camera.aspect) * 1.18; };
  const partR = () => { const dg = Math.hypot(st.L, st.H, st.T); return fitR(dg, dg) * 1.3; };
  const VIEWS = { iso: [ISO.theta, ISO.phi, '3D-Ansicht'], vorne: [0, Math.PI / 2, 'Vorderansicht'], oben: [0, 0.001, 'Draufsicht'], links: [-Math.PI / 2, Math.PI / 2, 'Seitenansicht von links'] };
  function markView(name) {
    document.querySelectorAll('#grpAnsicht button').forEach(b => b.classList.toggle('active', b.dataset.ansicht === name));
    if (step === 1 && name) $('ansichtLabel').textContent = VIEWS[name][2];
  }
  function setView(name) { const [th, ph] = VIEWS[name]; flyTo({ theta: th, phi: ph, r: partR(), target: center() }); markView(name); }
  function viewCorner() { flyTo({ theta: -0.62, phi: 1.0, r: fitR(st.L + st.T + 2 * G, st.H + st.T + 2 * G) * 1.25, target: new THREE.Vector3(st.L / 2, st.H / 2 + .2, 0) }); }
  function viewSheet() {
    const x0 = -G, x1 = st.L + 2 * G + st.T + .3, y0 = -3 * G - st.T - 0.9, y1 = st.H + G + .9;
    flyTo({ theta: 0, phi: Math.PI / 2, r: fitR(x1 - x0, y1 - y0), target: new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, -G) });
  }

  // ---------- Bedienung ----------
  document.querySelectorAll('#grpAnsicht button').forEach(b => b.onclick = () => setView(b.dataset.ansicht));
  document.querySelectorAll('.schritte button').forEach(b => b.onclick = () => setStep(+b.dataset.step));
  ['tglStrahlen', 'tglPfeile', 'tglBauteil', 'tglOrdnung', 'tglMasse'].forEach(id => $(id).onclick = () => { $(id).setAttribute('aria-pressed', String(!pressed(id))); applyState(); });
  $('sheet').onclick = viewSheet;
  $('resetBtn').onclick = () => { if (step === 1) setView('iso'); else if (step === 2) viewCorner(); else { foldAnim = null; setFold(0); viewCorner(); } };

  let foldAnim = null;
  function setFold(v) {
    fold = Math.min(1, Math.max(0, v)); $('fold').value = Math.round(fold * 100); $('foldOut').textContent = Math.round(fold * 100) + ' %';
    $('play').textContent = fold > 0.5 ? 'Zuklappen' : 'Aufklappen'; applyState();
  }
  $('fold').oninput = e => { foldAnim = null; setFold(e.target.value / 100); };
  $('transp').oninput = e => { transp = e.target.value / 100; $('transpOut').textContent = e.target.value + ' %'; applyState(); };
  $('play').onclick = () => {
    const from = fold, to = fold > 0.5 ? 0 : 1, t0 = performance.now(), ms = reduce ? 1 : 2200;
    foldAnim = now => { const k = Math.min(1, (now - t0) / ms); const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; setFold(from + (to - from) * e); if (k >= 1) { foldAnim = null; if (to === 1) viewSheet(); } };
    if (to === 1) viewCorner();
  };

  // Bauteil-Leiste mit Vorschaubildern
  const liste = $('teilListe');
  Object.entries(PARTS).forEach(([id, p]) => {
    const b = document.createElement('button'); b.dataset.id = id; b.setAttribute('aria-label', `Bauteil ${id.toUpperCase()}: ${p.name}`);
    let src = ''; try { src = vorschau(id); } catch (e) { /* ohne Vorschau weiter */ }
    b.innerHTML = `${src ? `<img src="${src}" alt="">` : ''}<span class="nr">${id.toUpperCase()} · ${p.name}</span>`;
    b.onclick = () => choose(id); liste.appendChild(b);
  });
  function choose(id) {
    [...liste.children].forEach(b => b.classList.toggle('active', b.dataset.id === id));
    build(id); setFold(0); setStep(1);
  }

  function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(wrap);

  function loop(now) {
    if (tween) tween(now);
    if (foldAnim) foldAnim(now);
    placeCamera(camera, cam);
    [st.arrows, st.masse].forEach(g => { if (g && g.visible) g.children.forEach(o => { if (o.userData.billboard) o.quaternion.copy(camera.quaternion); }); });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  resize();
  const start = (location.hash || '').replace('#', '').toLowerCase();
  choose(PARTS[start] ? start : 'a');
  cam.r = partR(); cam.target.copy(center()); cam.theta = ISO.theta; cam.phi = ISO.phi; tween = null;
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
